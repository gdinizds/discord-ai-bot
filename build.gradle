plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.1'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'dev.gdinizds'
version = '0.0.1-SNAPSHOT'
description = 'discord-ai-bot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion  = '2025.1.4'
    resilience4jVersion = '2.3.0'
    awsSdkVersion       = '2.29.50'
    openTelemetryVersion = '1.62.0'
    langchain4jVersion  = '1.20.1'
    pgvectorVersion     = '0.1.6'
    archunitVersion     = '1.4.1'
    jsoupVersion        = '1.23.2'
    wiremockVersion     = '3.13.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.github.resilience4j:resilience4j-bom:${resilience4jVersion}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        // Spring Boot 4.0.9 manages OTel 1.55.0; the OTel BOM supplies the CVE-2026-45292 fix.
        mavenBom "io.opentelemetry:opentelemetry-bom:${openTelemetryVersion}"
    }
    dependencies {
        // Kafka resolves this vulnerable LZ4 fork transitively; no imported BOM fixes it yet.
        // 1.11.4 includes the OSV fixes for CVE-2026-106449..CVE-2026-106453 and CVE-2026-59949.
        dependency 'at.yawk.lz4:lz4-java:1.11.4'
        dependency 'org.xerial.snappy:snappy-java:1.1.10.9'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation "com.pgvector:pgvector:${pgvectorVersion}"
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"

    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'io.github.resilience4j:resilience4j-micrometer'

    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache-client'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-redpanda'
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

graalvmNative {
    binaries {
        main {
            imageName = 'discord-ai-bot'
            mainClass = 'dev.gdinizds.discordaibot.DiscordAiBotApplication'
            buildArgs.addAll(
                    '-O3',
                    '--no-fallback',
                    '--enable-url-protocols=http,https',
                    '-march=compatibility',
                    '-H:+ReportExceptionStackTraces',
                    '-H:+UnlockExperimentalVMOptions',
                    '--enable-monitoring=heapdump,threaddump,jfr',
                    '-H:Preserve=package=org.flywaydb.*'
            )
        }
    }
}

tasks.matching { it.name.startsWith("processTestAot") || it.name.startsWith("aotTest") }.configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
    }
}

tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['runtimeClasspath']
    skipConfigs = []
    testConfigs = []
}
