name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: gradle

      - name: Generate runtime SBOM
        run: |
          chmod +x gradlew
          ./gradlew cyclonedxDirectBom --no-daemon --console=plain

      - name: Report runtime dependency findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: build/reports/cyclonedx-direct/bom.json
          version: v0.76.1
          scanners: vuln
          vuln-type: library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          output: trivy-java-all.txt

      - name: Enforce HIGH/CRITICAL dependency policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: build/reports/cyclonedx-direct/bom.json
          version: v0.76.1
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-java-gate.txt

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native-image stage for scanning (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          load: true
          pull: true
          tags: discord-ai-bot:builder-audit

      - name: Report build-stage OS and library findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: discord-ai-bot:builder-audit
          version: v0.76.1
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          output: trivy-builder-all.txt

      - name: Enforce HIGH/CRITICAL build-stage policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: discord-ai-bot:builder-audit
          version: v0.76.1
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-builder-gate.txt

      - name: Build image for scanning (do not publish)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: |
            ghcr.io/gdinizds/discord-ai-bot:${{ github.ref_name }}
            ghcr.io/gdinizds/discord-ai-bot:latest

      - name: Report image OS and library findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gdinizds/discord-ai-bot:${{ github.ref_name }}
          version: v0.76.1
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          output: trivy-image-all.txt

      - name: Enforce HIGH/CRITICAL image policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gdinizds/discord-ai-bot:${{ github.ref_name }}
          version: v0.76.1
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-image-gate.txt

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        run: |
          docker push ghcr.io/gdinizds/discord-ai-bot:${GITHUB_REF_NAME}
          docker push ghcr.io/gdinizds/discord-ai-bot:latest

      - name: Publish SBOM and security scan results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-sbom-and-security-scans
          path: |
            build/reports/cyclonedx-direct/bom.json
            build/reports/cyclonedx-direct/bom.xml
            trivy-java-all.txt
            trivy-java-gate.txt
            trivy-builder-all.txt
            trivy-builder-gate.txt
            trivy-image-all.txt
            trivy-image-gate.txt
          if-no-files-found: warn
